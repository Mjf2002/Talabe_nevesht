name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Test panel and language preparation
        run: node --test mobile-panel/tests.mjs tools/prepare-languages.test.mjs article-chat/server.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Prepare published languages
        run: node tools/prepare-languages.mjs
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}

      - name: Build site
        run: npx quartz build -d .i18n-build/content

      - name: Verify published resources
        run: node tools/check-published-resources.mjs public

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
